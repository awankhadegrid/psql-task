version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: postgres-container-sqltask
    restart: always

    environment:
      POSTGRES_DB: sqltask_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - pgdatasqltask:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pgdatasqltask: